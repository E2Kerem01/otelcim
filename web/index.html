<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- SEO and Brand Metadata -->
  <title>Otelcim | Otel & Turizm İş İlanları</title>
  <meta name="description" content="Otel ve turizm sektöründe hayalinizdeki işi veya aradığınız personeli Otelcim ile hızlıca bulun.">
  <meta name="theme-color" content="#1976D2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1E2B">

  <!-- Search engines and social sharing (Open Graph) -->
  <link rel="canonical" href="https://www.otelcim.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:site_name" content="Otelcim">
  <meta property="og:title" content="Otelcim | Otel & Turizm İş İlanları">
  <meta property="og:description" content="Otel ve turizm sektöründe hayalinizdeki işi veya aradığınız personeli Otelcim ile hızlıca bulun.">
  <meta property="og:url" content="https://www.otelcim.app/">
  <meta property="og:image" content="https://www.otelcim.app/icons/Icon-512.png">
  <meta property="og:image:alt" content="Otelcim logosu">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Otelcim | Otel & Turizm İş İlanları">
  <meta name="twitter:description" content="Otel ve turizm sektöründe hayalinizdeki işi veya aradığınız personeli Otelcim ile hızlıca bulun.">
  <meta name="twitter:image" content="https://www.otelcim.app/icons/Icon-512.png">
  <meta name="twitter:image:alt" content="Otelcim logosu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Otelcim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG primary with PNG fallback -->
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Lightweight, zero-dependency pure HTML/CSS Splash Styles -->
  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0F1E2B;
      }
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .splash-logo-box {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo-box svg {
      width: 80px;
      height: 80px;
      display: block;
    }

    .splash-wordmark {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1976D2;
      margin: 0 0 8px 0;
      line-height: 1.2;
    }

    .splash-tagline {
      font-size: 15px;
      font-weight: 400;
      color: #495057;
      margin: 0;
      max-width: 320px;
      line-height: 1.4;
    }

    /* Subtle CSS loading indicator */
    .splash-loader {
      margin-top: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(25, 118, 210, 0.15);
      border-top-color: #1976D2;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Dark mode variant (respects prefers-color-scheme) */
    @media (prefers-color-scheme: dark) {
      #splash {
        background-color: #0F1E2B;
      }

      .splash-wordmark {
        color: #29B6F6;
      }

      .splash-tagline {
        color: #CFD8DC;
      }

      .splash-spinner {
        border-color: rgba(41, 182, 246, 0.2);
        border-top-color: #29B6F6;
      }
    }

    /* Accessibility: Respects prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      #splash {
        transition: none !important;
      }

      .splash-spinner {
        animation: none !important;
        border-top-color: #1976D2 !important;
        opacity: 0.8;
      }

      @media (prefers-color-scheme: dark) {
        .splash-spinner {
          border-top-color: #29B6F6 !important;
        }
      }
    }
  </style>

  <!-- Splash removal lifecycle script -->
  <script id="splash-screen-script">
    var _splashRemoved = false;
    function removeSplashFromWeb() {
      if (_splashRemoved) return;
      _splashRemoved = true;
      var splashEl = document.getElementById("splash");
      if (splashEl) {
        splashEl.classList.add("fade-out");
        setTimeout(function () {
          if (splashEl.parentNode) {
            splashEl.parentNode.removeChild(splashEl);
          }
        }, 350);
      }
      var brandingEl = document.getElementById("splash-branding");
      if (brandingEl && brandingEl.parentNode) {
        brandingEl.parentNode.removeChild(brandingEl);
      }
      document.body.style.background = "transparent";
    }
    window.removeSplashFromWeb = removeSplashFromWeb;

    // Listen for Flutter's first rendered frame
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);

    // Fallback: If Flutter view elements are attached to DOM, guarantee splash removal
    if (window.MutationObserver) {
      var _observer = new MutationObserver(function (mutations, obs) {
        if (document.querySelector("flutter-view, flt-glass-pane")) {
          setTimeout(removeSplashFromWeb, 500);
          obs.disconnect();
        }
      });
      _observer.observe(document.documentElement, { childList: true, subtree: true });
    }
  </script>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="splash-container">
      <div class="splash-logo-box">
        <!-- Pure geometric brand mark matching web/icons/logo.svg -->
        <svg viewBox="0 0 128 128" width="80" height="80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="128" height="128" rx="28" fill="#1976D2"/>
          <rect x="58" y="18" width="12" height="7" rx="3.5" fill="#FFFFFF"/>
          <rect x="62" y="24" width="4" height="4" fill="#FFFFFF"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M64 26C43.013 26 26 43.013 26 64C26 84.987 43.013 102 64 102C84.987 102 102 84.987 102 64C102 43.013 84.987 26 64 26ZM64 41C51.297 41 41 51.297 41 64C41 76.703 51.297 87 64 87C76.703 87 87 76.703 87 64C87 51.297 76.703 41 64 41Z" fill="#FFFFFF"/>
          <rect x="36" y="98" width="56" height="8" rx="4" fill="#FFFFFF"/>
        </svg>
      </div>
      <h1 id="splash-title" class="splash-wordmark">Otelcim</h1>
      <p id="splash-tagline" class="splash-tagline">Otel ve turizm sezonluk iş ilanları</p>
      <div class="splash-loader" role="status" aria-label="Yükleniyor">
        <div class="splash-spinner"></div>
      </div>
    </div>
  </div>

  <!-- Immediate locale adaptation script (runs synchronously to prevent flash of wrong language) -->
  <script>
    (function () {
      var userLang = (navigator.language || navigator.userLanguage || 'tr').toLowerCase();
      var isTr = userLang.startsWith('tr');
      var titleEl = document.getElementById('splash-title');
      var taglineEl = document.getElementById('splash-tagline');
      if (titleEl) {
        titleEl.textContent = isTr ? 'Otelcim' : 'HospoJobs';
      }
      if (taglineEl) {
        taglineEl.textContent = isTr
          ? 'Otel ve turizm sezonluk iş ilanları'
          : 'Seasonal hotel & tourism jobs';
      }
    })();
  </script>

  <!-- Firebase Messaging Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('Firebase Messaging Service Worker registered:', registration);
          })
          .catch(function (error) {
            console.log('Firebase Messaging Service Worker registration failed:', error);
          });
      });
    }
  </script>

  <!-- Flutter Web entrypoint bootstrap -->
  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>

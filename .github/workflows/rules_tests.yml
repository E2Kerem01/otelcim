name: Security Rules Tests

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'rules-tests/**'
      - '.github/workflows/rules_tests.yml'
  push:
    branches: [ master, main ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'rules-tests/**'
      - '.github/workflows/rules_tests.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rules-tests/package-lock.json

      - name: Install rules-tests dependencies
        run: npm ci
        working-directory: rules-tests

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore & Storage rules tests against the emulators
        run: firebase emulators:exec --only firestore,storage --project otelcim-7f0ba "npm --prefix rules-tests test"

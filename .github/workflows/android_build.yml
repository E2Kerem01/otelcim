name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Release build is signed with the debug keystore (see
      # android/app/build.gradle.kts) so it needs no secrets, and
      # --split-per-abi keeps each APK small enough to share directly.
      - name: Build release APKs (split per ABI, debug-signed)
        run: flutter build apk --release --split-per-abi

      - name: Also build a universal debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: otelcim-android-apks
          path: build/app/outputs/flutter-apk/*.apk

name: PR Checks

on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject new bare catch blocks
        run: bash scripts/check_new_bare_catches.sh "${{ github.base_ref }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Informational only: the repo has a pre-existing lint/dead-code backlog
        # (tracked separately) unrelated to individual PRs. Real correctness
        # gates are the test and build steps below.
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web (compile check)
        run: flutter build web --release

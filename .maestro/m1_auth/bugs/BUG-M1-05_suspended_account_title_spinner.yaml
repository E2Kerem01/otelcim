# BUG-M1-05: Askıya alınmış hesap ekranı başlığı spinner'da kalıyor — beklenen: "Hesabınız Askıya Alındı" ve askı bitişi; gerçek: profil başlığı yerine sonsuz yükleme spinner'ı.
appId: com.example.otelcim
name: "BUG M1 suspended account message should load"
tags: [m1_auth, access-control, bug, expected-failure]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: suspended@e2e.test
- extendedWaitUntil:
    visible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin.*"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Hesabınız Askıya Alındı.*"
    timeout: 30000
- assertVisible: ".*Askı bitiş:.*"
- assertVisible: ".*Çıkış Yap.*"
- back
- extendedWaitUntil:
    visible: ".*Hesabınız Askıya Alındı.*"
    timeout: 10000
- assertNotVisible: ".*Ana Sayfa.*"


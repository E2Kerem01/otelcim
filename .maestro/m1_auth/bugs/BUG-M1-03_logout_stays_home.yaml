# BUG-M1-03: Çıkış sonrası login'e yönlendirme gerçekleşmiyor — beklenen: kaynakta _handleLogout ile /login ekranı; gerçek: cihazda ana sayfa kalıyor.
appId: com.example.otelcim
name: "BUG M1 logout should return to login"
tags: [m1_auth, access-control, bug, expected-failure]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: seeker@e2e.test
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Ayşe Aday.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Çıkış Yap.*"
    direction: DOWN
- tapOn: ".*Çıkış Yap.*"
- extendedWaitUntil:
    visible: ".*Giriş Yap.*"
    timeout: 10000
- assertNotVisible: ".*Ayşe Aday.*"


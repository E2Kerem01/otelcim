appId: com.example.otelcim
name: "m1 auth wrong password stays signed out"
tags: [m1_auth, negative]
---
- runFlow: ../common/launch.yaml
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Giriş Yap.*"
    timeout: 10000
- tapOn: ".*E-posta.*"
- inputText: seeker@e2e.test
- tapOn: ".*Şifre.*"
- inputText: Wrong1234
- hideKeyboard
- tapOn: ".*Giriş Yap.*"
- extendedWaitUntil:
    visible: ".*E-posta veya şifre hatalı.*"
    timeout: 10000
- assertVisible: ".*Giriş Yap.*"
- assertNotVisible: ".*Ayşe Aday.*"


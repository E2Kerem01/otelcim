appId: com.example.otelcim
name: "m1 auth duplicate registration error"
tags: [m1_auth, register, negative]
---
- runFlow: ../common/launch.yaml
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Giriş Yap.*"
    timeout: 10000
- tapOn: ".*Kayıt Ol.*"
- extendedWaitUntil:
    visible: ".*Hesap türü.*"
    timeout: 5000
- tapOn: ".*İş Arıyorum.*"
- scrollUntilVisible:
    element: ".*E-posta.*"
    direction: DOWN
- tapOn: "E-posta"
- inputText: seeker@e2e.test
- tapOn: "Şifre"
- inputText: Test1234!
- tapOn: "Ad Soyad"
- inputText: Tekrar Kullanıcı
- scrollUntilVisible:
    element: "Kayıt Ol"
    direction: DOWN
- tapOn:
    text: "Kayıt Ol"
    index: -1
- extendedWaitUntil:
    visible: ".*Bu e-posta adresi zaten kayıtlı.*"
    timeout: 10000
- assertVisible: ".*Kayıt Ol.*"

- scrollUntilVisible:
    element: ".*Filtreler.*"
    direction: UP
- tapOn: ".*Filtreler.*"
- scrollUntilVisible:
    element: ".*Sıralama.*"
    direction: DOWN
- tapOn: ".*Sıralama.*"
- tapOn: ".*Maaş düşükten yükseğe.*"
- tapOn: ".*Filtreleri uygula.*"

appId: com.example.otelcim
name: "admin removes and restores a listing"
tags: [m9_admin_content, admin, listings]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/listings"
- extendedWaitUntil:
    visible: "İlan Yönetimi"
    timeout: 10000
- tapOn: "İlan başlığıyla ara"
- inputText: "Resepsiyonist Aranıyor"
- pressKey: ENTER
- extendedWaitUntil:
    visible: ".*Resepsiyonist Aranıyor.*"
    timeout: 10000
- tapOn: "Kaldır"
- extendedWaitUntil:
    visible: "İlanı Kaldır"
    timeout: 5000
- tapOn: "Sebep (zorunlu)"
- inputText: "E2E moderasyon kontrolü"
- tapOn:
    text: "Kaldır"
    index: -1
- extendedWaitUntil:
    visible: "İlan kaldırıldı."
    timeout: 10000
- back
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- openLink: "otelcim-e2e://app/admin/listings"
- extendedWaitUntil:
    visible: "İlan Yönetimi"
    timeout: 10000
- tapOn: "İlan başlığıyla ara"
- inputText: "Resepsiyonist Aranıyor"
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Kaldırıldı"
    timeout: 10000
- tapOn: "Geri Yükle"
- extendedWaitUntil:
    visible: "İlan geri yüklendi."
    timeout: 10000
- back
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- openLink: "otelcim-e2e://app/admin/listings"
- extendedWaitUntil:
    visible: "İlan Yönetimi"
    timeout: 10000
- tapOn: "İlan başlığıyla ara"
- inputText: "Resepsiyonist Aranıyor"
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Aktif"
    timeout: 10000


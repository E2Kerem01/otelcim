appId: com.example.otelcim
name: "seeker cannot open admin content management"
tags: [m9_admin_content, access-control]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: seeker@e2e.test
- openLink: "otelcim-e2e://app/admin/listings"
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- assertNotVisible: "İlan Yönetimi"
- openLink: "otelcim-e2e://app/admin/banners"
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- assertNotVisible: "Banner Reklam Yönetimi"


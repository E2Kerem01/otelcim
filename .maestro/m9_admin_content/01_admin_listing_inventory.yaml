appId: com.example.otelcim
name: "admin listing inventory includes closed listings"
tags: [m9_admin_content, admin, listings]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/listings"
- extendedWaitUntil:
    visible: "İlan Yönetimi"
    timeout: 10000
- assertVisible: ".*Resepsiyonist Aranıyor.*"
- scrollUntilVisible:
    element: ".*Kapanmış İlan Housekeeping.*"
    direction: DOWN
- assertVisible: ".*Kapanmış İlan Housekeeping.*"
- assertVisible: "Kapalı"


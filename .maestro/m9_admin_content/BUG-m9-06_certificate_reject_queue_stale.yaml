# BUG-m9-06: Sertifika reddi sonrası kart kuyruktan kalkmıyor — PR #69 ile removeWhere eklenerek düzeltildi.
appId: com.example.otelcim
name: "BUG rejected certificate remains in queue"
tags: [m9_admin_content, admin, certificate, validation]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/certificates"
- extendedWaitUntil:
    visible: ".*Belge Onay Kuyruğu.*"
    timeout: 10000
- assertVisible: ".*Hijyen Eğitimi Sertifikası.*"
- tapOn: ".*Reddet.*"
- extendedWaitUntil:
    visible: ".*Belgeyi reddet.*"
    timeout: 5000
- tapOn: ".*Red sebebi.*"
- tapOn:
    text: ".*Reddet.*"
    index: -1
- assertVisible: ".*Red sebebi zorunludur\\..*"
- inputText: "Belge okunamıyor"
- tapOn:
    text: ".*Reddet.*"
    index: -1
- extendedWaitUntil:
    visible: ".*Belge reddedildi\\..*"
    timeout: 10000
- extendedWaitUntil:
    notVisible: ".*Hijyen Eğitimi Sertifikası.*"
    timeout: 10000

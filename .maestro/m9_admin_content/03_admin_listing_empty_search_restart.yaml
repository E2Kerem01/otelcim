appId: com.example.otelcim
name: "admin listing empty search and app restart"
tags: [m9_admin_content, admin, listings, resilience]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/listings"
- extendedWaitUntil:
    visible: "İlan Yönetimi"
    timeout: 10000
- tapOn: "İlan başlığıyla ara"
- inputText: "Böyle Bir İlan Yok"
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Sonuç bulunamadı."
    timeout: 10000
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 20000
- assertNotVisible: "İlan Yönetimi"


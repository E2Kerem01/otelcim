appId: com.example.otelcim
env:
  PASSWORD: "Test1234!"
---
# TUR 2: login/kayıt ekranlarında hideKeyboard kullanılmaz.
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: "Giriş Yap"
    timeout: 10000
- tapOn: "E-posta"
- inputText: ${EMAIL}
- tapOn: "Şifre"
- inputText: ${PASSWORD}
- tapOn:
    text: "Giriş Yap"
    index: -1
- extendedWaitUntil:
    notVisible: "Şifre"
    timeout: 15000

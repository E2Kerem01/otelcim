# BUG-M4-05: L2 kapatıldıktan sonra ana sayfa eski sayfalama state'ini gösteriyor — beklenen: "6 sonuç" ve L2'nin feed'den kalkması / gerçek: StatefulShell'de korunan ana sayfa "7 sonuç" gösteriyor.
appId: com.example.otelcim
name: "m4 bug - closing L2 leaves stale home results"
tags: [m4, bug, employer, lifecycle]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: employer@e2e.test
- tapOn: ".*Hesabım.*"
- tapOn: "İlanlarım"
- extendedWaitUntil:
    visible: ".*Garson \\(Sezonluk\\).*"
    timeout: 10000
# TAHMİN: Aktif ilanlar L3, L1, L2, L4 sırasındadır; L2'nin üçüncü Kapat düğmesi seçilir.
- tapOn:
    text: "Kapat"
    index: 2
- extendedWaitUntil:
    visible: ".*Garson \\(Sezonluk\\).*Kapalı.*"
    timeout: 10000
- back
- extendedWaitUntil:
    visible: ".*Hesabım.*"
    timeout: 10000
- tapOn: ".*Ana Sayfa.*"
- extendedWaitUntil:
    visible: ".*6 sonuç.*"
    timeout: 15000
- assertNotVisible: ".*Garson \\(Sezonluk\\).*"

appId: com.example.otelcim
name: "m7 - banned user is permanently locked out and cannot bypass via back button"
tags: [m7, admin_trust, auth, moderation]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: banned@e2e.test
- extendedWaitUntil:
    visible: ".*Hesabınız Yasaklandı.*"
    timeout: 10000
- assertVisible: ".*Hesabınız Yasaklandı.*"
- assertVisible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
- back
- extendedWaitUntil:
    visible: ".*Hesabınız Yasaklandı.*"
    timeout: 5000
- assertVisible: ".*Hesabınız Yasaklandı.*"
- tapOn: ".*Çıkış Yap.*"

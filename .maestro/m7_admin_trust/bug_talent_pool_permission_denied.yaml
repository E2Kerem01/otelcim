# BUG-m7-02: Yetenek havuzuna aday ekleme — PR #65 kuralları ile düzeltildi.
appId: com.example.otelcim
name: "m7 bug - add candidate to talent pool fails due to missing firestore rules"
tags: [m7, talent_pool, permissions]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: employer@e2e.test
- tapOn: ".*Mesajlar.*"
- extendedWaitUntil:
    visible: ".*Resepsiyonist Aranıyor.*"
    timeout: 10000
- tapOn: ".*Resepsiyonist Aranıyor.*"
- extendedWaitUntil:
    visible: ".*Sohbet.*"
    timeout: 10000
# AppBar sağındaki üç nokta / PopupMenu açılır
- tapOn:
    point: "92%,6%"
- extendedWaitUntil:
    visible: ".*Yetenek Havuzuna Ekle.*"
    timeout: 5000
- tapOn: ".*Yetenek Havuzuna Ekle.*"
- extendedWaitUntil:
    visible: ".*kişisini gelecek sezon yetenek havuzunuza eklemek üzeresiniz.*"
    timeout: 5000
- tapOn: ".*Ekle.*"
- extendedWaitUntil:
    visible: ".*Aday yetenek havuzunuza eklendi.*"
    timeout: 10000
- assertVisible: ".*Aday yetenek havuzunuza eklendi.*"
- back
- tapOn: ".*Hesabım.*"
- scrollUntilVisible:
    element: ".*Yetenek Havuzum.*"
    direction: DOWN
- tapOn: ".*Yetenek Havuzum.*"
- extendedWaitUntil:
    visible: ".*Ayşe Aday.*"
    timeout: 10000
- assertVisible: ".*Ayşe Aday.*"

# BUG-m7-05: Admin kullanıcı yönetimi, arama ve yasaklama akışı — PR #69, #71, #72 ile güncellendi.
appId: com.example.otelcim
name: "m7 bug - admin searches user bans seeker and verifies lockout"
tags: [m7, admin, users, moderation]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Admin Yönetici.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Yönetim Paneli.*"
    direction: DOWN
- tapOn: ".*Yönetim Paneli.*"
- extendedWaitUntil:
    visible: ".*Genel Bakış.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Kullanıcı Yönetimi.*"
    direction: DOWN
- tapOn: ".*Kullanıcı Yönetimi.*"
- extendedWaitUntil:
    visible: ".*İsim, e-posta, otel veya telefonla ara.*"
    timeout: 10000
- tapOn: ".*İsim, e-posta, otel veya telefonla ara.*"
- inputText: "Ayşe"
- hideKeyboard
- extendedWaitUntil:
    visible: ".*Ayşe Aday.*"
    timeout: 10000
- assertVisible: ".*Ayşe Aday.*"
- assertVisible: ".*seeker@e2e.test.*"
- tapOn: ".*Yasakla.*"
- extendedWaitUntil:
    visible: ".*Kullanıcıyı Yasakla.*"
    timeout: 5000
- tapOn: ".*Sebep \\(zorunlu\\).*"
- inputText: "Kural ihlali"
- hideKeyboard
- tapOn: ".*Onayla.*"
- extendedWaitUntil:
    visible: ".*İşlem tamamlandı\\..*"
    timeout: 10000
- assertVisible: ".*Yasaklı.*"
# Yönetici çıkış yapar ve yasaklanan Ayşe Aday ile giriş denenir
- back
- back
- scrollUntilVisible:
    element: ".*Çıkış Yap.*"
    direction: DOWN
- tapOn: ".*Çıkış Yap.*"
- extendedWaitUntil:
    visible: ".*Çıkış yapmak istediğinize emin misiniz.*"
    timeout: 5000
- tapOn:
    text: ".*Çıkış Yap.*"
    index: 1
- extendedWaitUntil:
    visible: ".*Giriş Yap.*"
    timeout: 10000
- tapOn: "E-posta"
- inputText: "seeker@e2e.test"
- tapOn: "Şifre"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    text: "Giriş Yap"
    index: -1
- extendedWaitUntil:
    visible: ".*Hesabınız Yasaklandı.*"
    timeout: 10000
- assertVisible: ".*Hesabınız Yasaklandı.*"

# BUG-m7-04: Admin şikayet yönetimi ekranına erişim ve R1 şikayetinin moderasyonu — PR #72, #69, #66 ile düzeltildi.
appId: com.example.otelcim
name: "m7 bug - admin reviews and dismisses report r1 on listing l8"
tags: [m7, admin, reports, moderation]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Admin Yönetici.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Yönetim Paneli.*"
    direction: DOWN
- tapOn: ".*Yönetim Paneli.*"
- extendedWaitUntil:
    visible: ".*Genel Bakış.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Şikâyetler.*"
    direction: DOWN
- tapOn: ".*Şikâyetler.*"
- extendedWaitUntil:
    visible: ".*Hedef: İlan • L8.*"
    timeout: 10000
- assertVisible: ".*Hedef: İlan • L8.*"
- assertVisible: ".*Şüpheli ilan.*"
- tapOn: ".*Reddet.*"
- extendedWaitUntil:
    visible: ".*Şikayeti Reddet.*"
    timeout: 5000
- tapOn: ".*Uygula.*"
- extendedWaitUntil:
    visible: ".*Bekleyen şikâyet bulunmuyor\\..*"
    timeout: 10000
- assertVisible: ".*Bekleyen şikâyet bulunmuyor\\..*"

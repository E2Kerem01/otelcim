appId: com.example.otelcim
name: "m7 - employer can navigate to talent pool from profile menu"
tags: [m7, admin_trust, employer, talent_pool]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: employer@e2e.test
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Mehmet İşveren.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Yetenek Havuzum.*"
    direction: DOWN
- assertVisible: ".*Yetenek Havuzum.*"
- tapOn: ".*Yetenek Havuzum.*"
- extendedWaitUntil:
    visible: ".*Yetenek Havuzu.*"
    timeout: 10000
- assertVisible: ".*Yetenek Havuzu.*"
- back
- extendedWaitUntil:
    visible: ".*Mehmet İşveren.*"
    timeout: 10000
- assertVisible: ".*Mehmet İşveren.*"

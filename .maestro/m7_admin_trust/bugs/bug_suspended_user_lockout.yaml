# BUG-m7-06: AccountSuspendedScreen build() içinde inline FutureProvider kullanımı nedeniyle ekran kalıcı loading durumunda kalıyor — beklenen: Süreli askıya alınmış kullanıcı (suspended@e2e.test) giriş yaptığında /account-suspended rotasında "Hesabınız Askıya Alındı" başlığı ve askı bitiş tarihi ("Askı bitiş: ...") gösterilmeli / gerçek: profileAsync sürekli loading durumunda kalarak CircularProgressIndicator gösteriyor; başlık ve askı bitiş süresi asla ekranda render edilmiyor.
appId: com.example.otelcim
name: "m7 bug - suspended user lockout screen stuck in loading spinner"
tags: [m7, bugs, auth, moderation]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: suspended@e2e.test
- extendedWaitUntil:
    visible: ".*Hesabınız Askıya Alındı.*"
    timeout: 10000
- assertVisible: ".*Hesabınız Askıya Alındı.*"
- assertVisible: ".*Askı bitiş:.*"
- assertVisible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
- tapOn: ".*Çıkış Yap.*"

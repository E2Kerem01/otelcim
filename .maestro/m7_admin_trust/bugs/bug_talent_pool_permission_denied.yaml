# BUG-m7-02: Yetenek havuzuna aday ekleme Firestore kuralı eksikliği yüzünden engelleniyor — beklenen: İşveren sohbet ekranından adayı yetenek havuzuna ekleyebilmeli ve aday Yetenek Havuzum ekranında listelenmeli / gerçek: firestore.rules içinde user_profiles/{userId}/talent_pool/{candidateId} alt koleksiyon kuralı bulunmadığı için yazma işlemi permission-denied ile başarısız oluyor.
appId: com.example.otelcim
name: "m7 bug - add candidate to talent pool fails due to missing firestore rules"
tags: [m7, bugs, talent_pool, permissions]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: employer@e2e.test
- tapOn: ".*Mesajlar.*"
- extendedWaitUntil:
    visible: ".*Resepsiyonist Aranıyor.*"
    timeout: 10000
- tapOn: ".*Resepsiyonist Aranıyor.*"
- extendedWaitUntil:
    visible: ".*Ayşe Aday.*"
    timeout: 10000
# AppBar sağındaki üç nokta / PopupMenu açılır
- tapOn:
    point: "92%,6%" # TAHMİN: Sohbet AppBar seçenekler menüsü
- extendedWaitUntil:
    visible: ".*Yetenek Havuzuna Ekle.*"
    timeout: 5000
- tapOn: ".*Yetenek Havuzuna Ekle.*"
- extendedWaitUntil:
    visible: ".*Adayı Yetenek Havuzuna Ekle.*"
    timeout: 5000
- tapOn: ".*Ekle.*"
- extendedWaitUntil:
    visible: ".*Aday yetenek havuzunuza eklendi\\..*"
    timeout: 10000
- assertVisible: ".*Aday yetenek havuzunuza eklendi\\..*"
- back
- tapOn: ".*Hesabım.*"
- scrollUntilVisible:
    element: ".*Yetenek Havuzum.*"
    direction: DOWN
- tapOn: ".*Yetenek Havuzum.*"
- extendedWaitUntil:
    visible: ".*Ayşe Aday.*"
    timeout: 10000
- assertVisible: ".*Ayşe Aday.*"

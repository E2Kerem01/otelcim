# BUG-m7-06: AccountSuspendedScreen build() içinde inline FutureProvider kullanımı nedeniyle ekran kalıcı loading durumunda kalıyor — beklenen: Kalıcı yasaklanmış kullanıcı (banned@e2e.test) giriş yaptığında /account-suspended rotasında "Hesabınız Yasaklandı" başlığı gösterilmeli / gerçek: profileAsync sürekli loading durumunda kaldığı için CircularProgressIndicator gösteriliyor, "Hesabınız Yasaklandı" başlığı asla render edilmiyor.
appId: com.example.otelcim

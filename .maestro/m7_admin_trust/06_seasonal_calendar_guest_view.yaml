- assertVisible: ".*Kış Sezonu 2025-26.*"
- assertVisible: ".*Tüm Yıl Sürekli İşe Alım.*"
- scrollUntilVisible:
    element: ".*Sezonluk işe alım hatırlatıcıları kurmak için lütfen giriş yapın\\..*"
    direction: DOWN
- assertVisible: ".*Sezonluk işe alım hatırlatıcıları kurmak için lütfen giriş yapın\\..*"
- assertVisible: ".*Giriş Yap.*"
- back
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- assertVisible: ".*Ana Sayfa.*"

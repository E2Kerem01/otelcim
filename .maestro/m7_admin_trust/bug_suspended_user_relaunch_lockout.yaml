# BUG-m7-06: Uygulama yeniden başlatıldığında kilit ekranında askı başlığı yerine loading kalıyor — D22 (#66) ile düzeltildi.
appId: com.example.otelcim
name: "m7 bug - suspended user lockout screen title fails on relaunch"
tags: [m7, auth, moderation, restart]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: suspended@e2e.test
- extendedWaitUntil:
    visible: ".*Hesabınız Askıya Alındı.*"
    timeout: 10000
- assertVisible: ".*Hesabınız Askıya Alındı.*"
- assertVisible: ".*Askı bitiş:.*"
# Uygulama kapatılıp önbellek temizlenmeden yeniden başlatılır
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Hesabınız Askıya Alındı.*"
    timeout: 15000
- assertVisible: ".*Hesabınız Askıya Alındı.*"
- assertVisible: ".*Askı bitiş:.*"

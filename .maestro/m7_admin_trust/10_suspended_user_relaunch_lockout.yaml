appId: com.example.otelcim
name: "m7 - suspended user lockout persists after app restart"
tags: [m7, admin_trust, moderation, restart]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: suspended@e2e.test
- extendedWaitUntil:
    visible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
    timeout: 10000
- assertVisible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
# Uygulama kapatılıp önbellek temizlenmeden yeniden başlatılır
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
    timeout: 15000
- assertVisible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
- assertNotVisible: ".*Resepsiyonist Aranıyor.*"

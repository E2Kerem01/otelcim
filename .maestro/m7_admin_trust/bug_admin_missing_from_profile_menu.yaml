# BUG-m7-01: Admin rolü için Hesabım ekranında Yönetim Paneli menü öğesi — PR #72 (A2/D1) ve PR #69 ile düzeltildi.
appId: com.example.otelcim
name: "m7 bug - admin panel entry missing from profile menu"
tags: [m7, admin]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Admin Yönetici.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Yönetim Paneli.*"
    direction: DOWN
- assertVisible: ".*Yönetim Paneli.*"
- tapOn: ".*Yönetim Paneli.*"
- extendedWaitUntil:
    visible: ".*Genel Bakış.*"
    timeout: 10000
- assertVisible: ".*Yönetim Paneli.*"
- scrollUntilVisible:
    element: ".*Şikâyetler.*"
    direction: DOWN
- assertVisible: ".*Şikâyetler.*"
- assertVisible: ".*Kullanıcı Yönetimi.*"
- assertVisible: ".*İlan Yönetimi.*"

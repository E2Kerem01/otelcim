# BUG-m7-06: AccountSuspendedScreen build() içinde inline FutureProvider kullanımı nedeniyle ekran kalıcı loading durumunda kalıyor — D22 (#66) ile düzeltildi.
appId: com.example.otelcim
name: "m7 bug - banned user lockout screen stuck in loading spinner"
tags: [m7, auth, moderation]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: banned@e2e.test
- extendedWaitUntil:
    visible: ".*Hesabınız Yasaklandı.*"
    timeout: 10000
- assertVisible: ".*Hesabınız Yasaklandı.*"
- assertVisible: ".*Bunun bir hata olduğunu düşünüyorsanız destek ekibimizle iletişime geçin\\..*"
- tapOn: ".*Çıkış Yap.*"

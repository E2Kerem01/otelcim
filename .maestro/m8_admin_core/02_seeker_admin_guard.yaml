appId: com.example.otelcim
name: "m8 seeker deep links to admin return home"
tags: [m8_admin_core, permissions, wrong-role]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: seeker@e2e.test
- openLink: "otelcim-e2e://app/admin"
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- assertNotVisible: ".*Yönetim Paneli.*"
- openLink: "otelcim-e2e://app/admin/users"
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 10000
- assertNotVisible: ".*Kullanıcı Yönetimi.*"
- assertVisible: ".*Resepsiyonist Aranıyor.*"


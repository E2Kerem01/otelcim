appId: com.example.otelcim
name: "m8 admin dismisses report and sees audit entry"
tags: [m8_admin_core, reports, audit]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/reports"
- extendedWaitUntil:
    visible: ".*Şikâyetler.*"
    timeout: 15000
- assertVisible: ".*Şüpheli ilan.*"
- assertVisible: ".*Hedef: İlan • L8.*"
- assertVisible: ".*Bildiren:.*"
- tapOn: ".*Reddet.*"
- extendedWaitUntil:
    visible: ".*Şikayeti Reddet.*"
    timeout: 5000
- assertVisible: '.*Sebep \(isteğe bağlı\).*'
- tapOn: '.*Sebep \(isteğe bağlı\).*'
- inputText: "İnceleme tamamlandı"
- tapOn: ".*Uygula.*"
- extendedWaitUntil:
    visible: '.*Şikayeti Reddet işlemi tamamlandı\..*'
    timeout: 10000
- extendedWaitUntil:
    visible: '.*Bekleyen şikâyet bulunmuyor\..*'
    timeout: 10000
- openLink: "otelcim-e2e://app/admin/audit-log"
- extendedWaitUntil:
    visible: ".*İşlem Geçmişi.*"
    timeout: 10000
- assertVisible: ".*Şikayeti Reddet.*"
- assertVisible: ".*Yönetici:.*"
- assertVisible: ".*Sebep: İnceleme tamamlandı.*"

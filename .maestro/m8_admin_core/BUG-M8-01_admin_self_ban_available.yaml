# BUG-M8-01: Yönetici kendini yasaklayabiliyor — PR #73 (D21) ile yöneticinin kendi kartında (Siz) rozeti ve yasaklama/askıya alma aksiyonları devre dışı bırakıldı.
appId: com.example.otelcim
name: "m8 bug admin can see self-ban action"
tags: [m8_admin_core, permissions]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/users"
- extendedWaitUntil:
    visible: ".*İsim, e-posta, otel veya telefonla ara.*"
    timeout: 15000
- tapOn: ".*İsim, e-posta, otel veya telefonla ara.*"
- inputText: "admin@e2e.test"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Admin Yönetici.*"
    timeout: 10000
- assertVisible: '.*admin@e2e\.test.*'
- assertVisible: ".*Siz.*"
- tapOn: ".*Yasakla.*"
- assertNotVisible: ".*Kullanıcıyı Yasakla.*"

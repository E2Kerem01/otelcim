# BUG-M8-03: Raporlanan ilanı kaldırma sonrası Flutter assertion çökmesi — D34 (#66) ile ReasonDialog düzeltildi.
appId: com.example.otelcim
name: "BUG m8 removing reported listing crashes after applying action"
tags: [m8_admin_core, reports, listing-moderation, crash]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: admin@e2e.test
- openLink: "otelcim-e2e://app/admin/reports"
- extendedWaitUntil:
    visible: ".*Şikâyetler.*"
    timeout: 15000
- tapOn: ".*Tümü.*"
- extendedWaitUntil:
    visible: ".*Hedef: İlan • L8.*"
    timeout: 10000
- assertVisible: ".*İlanı kaldır.*"
- tapOn: ".*İlanı kaldır.*"
- extendedWaitUntil:
    visible: ".*İlanı Kaldır.*"
    timeout: 5000
- assertVisible: '.*Sebep \(isteğe bağlı\).*'
- tapOn: '.*Sebep \(isteğe bağlı\).*'
- inputText: "Şüpheli ilan doğrulaması"
- tapOn: ".*Uygula.*"
- extendedWaitUntil:
    visible: '.*İlanı Kaldır işlemi tamamlandı\..*'
    timeout: 10000
- openLink: "otelcim-e2e://app/"
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 15000
- assertNotVisible: ".*Güvenlik Görevlisi.*"

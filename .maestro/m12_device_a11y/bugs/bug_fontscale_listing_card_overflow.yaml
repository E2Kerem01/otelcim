# BUG-m12-05: Büyük yazı boyutunda (font scale 2.0) ana sayfa ilan kartı rozet satırında taşma (RenderFlex overflow / D31)
# beklenen: Yazı boyutu 2.0 olduğunda kartın üst rozet satırı taşmamalı, favori butonu ("Favorilere ekle") ve ilan tarihi ekranda görünür olmalıdır.
# gerçek: home_screen_widgets.dart:860 içindeki tek satırlı Row büyük yazı sebebiyle sağdan 18-116 px taşar (D31); favori kalbi ve tarih görünür alan dışına itilir / kesilir.
appId: com.example.otelcim
name: "bug - font scale 2.0 listing card header row overflow"
tags: [bug, m12, fontscale, a11y, overflow, d31]
---
- runFlow: ../../common/launch.yaml

- extendedWaitUntil:
    visible: ".*Resepsiyonist Aranıyor.*"
    timeout: 15000

# Assert that the listing card header row does not push favorite button and date off-screen
- assertVisible:
    text: ".*Favorilere ekle.*"
- assertVisible:
    text: ".*23\\.9\\.2026.*"

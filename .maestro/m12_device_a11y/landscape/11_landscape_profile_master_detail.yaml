appId: com.example.otelcim
name: "m12 - 11 landscape master detail profile layout"
tags: [m12, landscape, profile, responsive]
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/login.yaml
    env:
      EMAIL: seeker@e2e.test

# Switch orientation to landscape
- setOrientation: LANDSCAPE_LEFT

# Open profile in landscape mode
- tapOn: ".*Hesabım.*"
- extendedWaitUntil:
    visible: ".*Genel Bakış.*"
    timeout: 10000

# In landscape (width >= 768), Master-Detail two-panel layout is active
# Left sidebar navigation items:
- assertVisible: ".*Genel Bakış.*"
- assertVisible: ".*Profili Düzenle.*"
- assertVisible: ".*Belgelerim / Sertifika Cüzdanı.*"
- assertVisible: ".*Favorilerim.*"

# Right detail pane:
- assertVisible: ".*Profil Genel Bakışı.*"
- assertVisible: ".*Ayşe Aday.*"
- assertVisible: ".*Hemen Başlayabilir.*"
- takeScreenshot: m12_landscape_profile

# Navigate to Edit Profile section within Master-Detail layout
- tapOn: ".*Profili Düzenle.*"
- extendedWaitUntil:
    visible: ".*Ad Soyad.*"
    timeout: 10000

- assertVisible: ".*Ad Soyad.*"

# Restore orientation to portrait
- setOrientation: PORTRAIT

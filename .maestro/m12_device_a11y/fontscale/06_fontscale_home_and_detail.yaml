appId: com.example.otelcim
name: "m12 - 06 font scale 2.0 home feed and listing detail"
tags: [m12, fontscale, a11y, scroll]
---
- runFlow: ../../common/launch.yaml

- extendedWaitUntil:
    visible: ".*Resepsiyonist Aranıyor.*"
    timeout: 15000

# Home feed renders properly under large 2.0 font scale
- assertVisible: ".*7 sonuç.*"
- takeScreenshot: m12_fontscale_home

# Scroll through feed items with enlarged text
- scrollUntilVisible:
    element: ".*Güvenlik Görevlisi.*"
    direction: DOWN
- assertVisible: ".*Güvenlik Görevlisi.*"

# Scroll back up to first listing and open detail
- scrollUntilVisible:
    element: ".*Resepsiyonist Aranıyor.*"
    direction: UP
- tapOn: ".*Resepsiyonist Aranıyor.*"
- extendedWaitUntil:
    visible: ".*İlan Detayı.*"
    timeout: 10000

- takeScreenshot: m12_fontscale_listing_detail
- assertVisible: ".*Resepsiyonist Aranıyor.*"

# Ensure bottom action buttons remain reachable and not obscured by text enlargement
- scrollUntilVisible:
    element: ".*Mesaj Gönder.*"
    direction: DOWN
- assertVisible: ".*Mesaj Gönder.*"

appId: com.example.otelcim
name: "m2 discovery - category chips filter and reset"
tags: [m2_discovery, category]
---
- runFlow: ../common/launch.yaml
- tapOn: ".*Resepsiyon.*"
- extendedWaitUntil:
    visible: ".*1 sonuç.*"
    timeout: 10000
- assertVisible: ".*Resepsiyonist Aranıyor.*"
- assertNotVisible: '.*Garson \(Sezonluk\).*'
- tapOn: ".*Tümü.*"
- extendedWaitUntil:
    visible: ".*7 sonuç.*"
    timeout: 10000
- assertVisible: ".*Barmen - Boost.*"

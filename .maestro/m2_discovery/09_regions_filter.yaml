- scrollUntilVisible:
    element: ".*Bodrum.*"
    direction: DOWN
- tapOn: ".*Bodrum.*"
- extendedWaitUntil:
    visible: ".*Animatör.*"
    timeout: 10000
- assertVisible: ".*Bodrum.*"
- assertVisible: ".*1 sonuç.*"
- assertNotVisible: ".*Resepsiyonist Aranıyor.*"

appId: com.example.otelcim
name: "m2 discovery - invalid salary range stays in filter sheet"
tags: [m2_discovery, filters, edge]
---
- runFlow: ../common/launch.yaml
- tapOn: ".*Filtreler.*"
- extendedWaitUntil:
    visible: ".*Gelişmiş filtreler.*"
    timeout: 10000
- tapOn: ".*En düşük maaş.*"
- inputText: "40000"
- tapOn: ".*En yüksek maaş.*"
- inputText: "30000"
- hideKeyboard
- tapOn: ".*Filtreleri uygula.*"
- extendedWaitUntil:
    visible: '.*Maaş aralığını kontrol edin\..*'
    timeout: 10000
- assertVisible: ".*Gelişmiş filtreler.*"
- assertNotVisible: ".*0 sonuç.*"

- assertVisible: ".*aktif ilan.*"
- back
- assertVisible: ".*Bölgeler.*"
- back
- extendedWaitUntil:
    visible: ".*7 sonuç.*"
    timeout: 10000
- assertVisible: ".*Ana Sayfa.*"


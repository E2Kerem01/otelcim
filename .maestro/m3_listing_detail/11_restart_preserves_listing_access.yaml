appId: com.example.otelcim
name: "m3 app restart keeps authenticated listing access"
tags: [m3, listing-detail, restart]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: seeker@e2e.test
- tapOn: ".*Resepsiyonist Aranıyor.*"
- extendedWaitUntil:
    visible: ".*İlan Detayı.*"
    timeout: 10000
- assertVisible: ".*Deniz Otel.*"
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Ana Sayfa.*"
    timeout: 20000
- tapOn: ".*Resepsiyonist Aranıyor.*"
- extendedWaitUntil:
    visible: ".*İlan Detayı.*"
    timeout: 10000
- assertVisible: ".*Resepsiyonist Aranıyor.*"
- assertVisible: '.*35\.000 TL.*'

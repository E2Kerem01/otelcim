appId: com.example.otelcim
name: "m3 employer viewing another employer listing has no owner controls"
tags: [m3, listing-detail, wrong-role]
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: employer@e2e.test
- openLink: "otelcim-e2e://app/listing/L6"
- extendedWaitUntil:
    visible: ".*İlan Detayı.*"
    timeout: 10000
- assertVisible: ".*Animatör.*"
- assertVisible: ".*Kaya Butik Otel.*"
- assertVisible: ".*Mesaj Gönder.*"
- assertNotVisible: ".*İlan Yönetimi.*"
- assertNotVisible: ".*QR Poster Oluştur.*"
